<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Solana Star Catcher</title>
<style>
  :root {
    --purple: #9945FF;
    --green: #14F195;
    --bg: #0d0820;
    --bg2: #1b0f3a;
    --text: #f3eeff;
    --muted: #b7a8d9;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, -apple-system, "Segoe UI", sans-serif;
    touch-action: manipulation;
    user-select: none; -webkit-user-select: none;
  }
  #app {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background:
      radial-gradient(120% 60% at 15% 0%, rgba(153,69,255,.35), transparent 60%),
      radial-gradient(100% 50% at 100% 100%, rgba(20,241,149,.14), transparent 60%),
      linear-gradient(180deg, var(--bg2), var(--bg));
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 12px 16px;
    border-bottom: 2px solid transparent;
    border-image: linear-gradient(90deg, var(--purple), var(--green)) 1;
    background: rgba(13,8,32,.7);
  }
  h1 {
    margin: 0; font-size: clamp(16px, 4.6vw, 26px); font-weight: 800; letter-spacing: .02em;
    background: linear-gradient(90deg, var(--purple), var(--green));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    white-space: nowrap;
  }
  .stats { display: flex; gap: 18px; }
  .stat { text-align: right; line-height: 1.1; }
  .stat small { display: block; font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .stat b { font-size: clamp(20px, 5vw, 28px); font-variant-numeric: tabular-nums; }
  #score { color: var(--green); }
  #time { color: #fff; }
  #time.low { color: #ff6b8a; }
  #stage { position: relative; flex: 1; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .overlay {
    position: absolute; inset: 0; z-index: 2;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px; text-align: center;
    background: rgba(13,8,32,.78);
  }
  .overlay.hidden { display: none; }
  .overlay h2 { margin: 0; font-size: clamp(22px, 6vw, 34px); }
  .overlay p { margin: 0; color: var(--muted); font-size: clamp(14px, 3.6vw, 17px); line-height: 1.7; }
  .final { font-size: clamp(56px, 18vw, 96px); font-weight: 800; color: var(--green); line-height: 1; font-variant-numeric: tabular-nums; }
  .best { color: var(--text); }
  button {
    font: inherit; font-weight: 800; font-size: 18px;
    padding: 14px 40px; border: 0; border-radius: 999px; cursor: pointer;
    color: #0d0820;
    background: linear-gradient(90deg, var(--green), #7bf7c6 45%, var(--purple) 160%);
    box-shadow: 0 0 24px rgba(20,241,149,.35);
    transition: transform .12s ease;
  }
  button:active { transform: scale(.96); }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Solana Star Catcher</h1>
    <div class="stats">
      <div class="stat"><small>スコア</small><b id="score">0</b></div>
      <div class="stat"><small>残り時間</small><b id="time">30</b></div>
    </div>
  </header>
  <div id="stage">
    <canvas id="c" aria-label="ゲーム画面"></canvas>
    <div class="overlay" id="startScreen">
      <h2>落ちてくる星をタップ！</h2>
      <p>30秒でできるだけ多く集めよう。<br>緑の星は1点、小さな紫の星は3点。</p>
      <button id="startBtn">スタート</button>
    </div>
    <div class="overlay hidden" id="endScreen">
      <h2>タイムアップ！</h2>
      <div class="final" id="finalScore">0</div>
      <p class="best" id="bestText"></p>
      <button id="retryBtn">もう一度</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var DURATION = 30;
  var PURPLE = "#9945FF", GREEN = "#14F195";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var scoreEl = document.getElementById("score");
  var timeEl = document.getElementById("time");
  var startScreen = document.getElementById("startScreen");
  var endScreen = document.getElementById("endScreen");
  var finalEl = document.getElementById("finalScore");
  var bestEl = document.getElementById("bestText");

  var W = 0, H = 0, dpr = 1;
  var stars = [], particles = [], popups = [];
  var score = 0, timeLeft = DURATION;
  var playing = false, last = 0, spawnTimer = 0, elapsed = 0;
  var best = 0;
  try { best = parseInt(localStorage.getItem("ssc_best"), 10) || 0; } catch (e) {}

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    var r = canvas.getBoundingClientRect();
    W = r.width; H = r.height;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  function rand(a, b) { return a + Math.random() * (b - a); }

  function spawn() {
    var bonus = Math.random() < 0.18;
    var base = Math.max(34, Math.min(58, W * 0.11));
    var r = bonus ? base * 0.62 : rand(base * 0.8, base);
    stars.push({
      x: rand(r, W - r), y: -r,
      r: r,
      vy: (bonus ? rand(260, 340) : rand(130, 220)) * (1 + elapsed / DURATION * 0.5) * Math.max(0.7, H / 700),
      rot: rand(0, Math.PI), vr: rand(-1.5, 1.5),
      bonus: bonus,
      points: bonus ? 3 : 1,
      color: bonus ? PURPLE : GREEN
    });
  }

  function starPath(x, y, r, rot) {
    ctx.beginPath();
    for (var i = 0; i < 10; i++) {
      var rad = i % 2 === 0 ? r : r * 0.45;
      var a = rot + i * Math.PI / 5 - Math.PI / 2;
      var px = x + Math.cos(a) * rad, py = y + Math.sin(a) * rad;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
  }

  function burst(x, y, color) {
    for (var i = 0; i < 12; i++) {
      var a = rand(0, Math.PI * 2), s = rand(80, 240);
      particles.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5, max: 0.5, color: color });
    }
  }

  function hit(px, py) {
    for (var i = stars.length - 1; i >= 0; i--) {
      var s = stars[i];
      var dx = px - s.x, dy = py - s.y;
      var reach = Math.max(s.r * 1.35, 28);
      if (dx * dx + dy * dy <= reach * reach) {
        stars.splice(i, 1);
        score += s.points;
        scoreEl.textContent = score;
        burst(s.x, s.y, s.color);
        popups.push({ x: s.x, y: s.y, text: "+" + s.points, life: 0.7, color: s.color });
        return;
      }
    }
  }

  canvas.addEventListener("pointerdown", function (e) {
    if (!playing) return;
    e.preventDefault();
    var r = canvas.getBoundingClientRect();
    hit(e.clientX - r.left, e.clientY - r.top);
  });

  function update(dt) {
    elapsed += dt;
    timeLeft = Math.max(0, DURATION - elapsed);
    timeEl.textContent = Math.ceil(timeLeft);
    timeEl.classList.toggle("low", timeLeft <= 5);

    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawn();
      spawnTimer = rand(0.35, 0.65) * (1 - elapsed / DURATION * 0.45);
    }
    stars.forEach(function (s) { s.y += s.vy * dt; s.rot += s.vr * dt; });
    stars = stars.filter(function (s) { return s.y < H + s.r * 2; });

    if (timeLeft <= 0) endGame();
  }

  function draw(dt) {
    ctx.clearRect(0, 0, W, H);

    stars.forEach(function (s) {
      ctx.save();
      ctx.shadowColor = s.color;
      ctx.shadowBlur = 22;
      starPath(s.x, s.y, s.r, s.rot);
      ctx.fillStyle = s.color;
      ctx.fill();
      ctx.shadowBlur = 0;
      starPath(s.x, s.y, s.r * 0.5, s.rot);
      ctx.fillStyle = "rgba(255,255,255,.35)";
      ctx.fill();
      ctx.restore();
    });

    particles.forEach(function (p) {
      p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    });
    ctx.globalAlpha = 1;
    particles = particles.filter(function (p) { return p.life > 0; });

    ctx.font = "800 24px system-ui, sans-serif";
    ctx.textAlign = "center";
    popups.forEach(function (p) {
      p.life -= dt; p.y -= 50 * dt;
      ctx.globalAlpha = Math.max(0, p.life / 0.7);
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, p.x, p.y);
    });
    ctx.globalAlpha = 1;
    popups = popups.filter(function (p) { return p.life > 0; });
  }

  function loop(now) {
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    if (playing) update(dt);
    draw(dt);
    requestAnimationFrame(loop);
  }

  function startGame() {
    resize();
    stars = []; particles = []; popups = [];
    score = 0; elapsed = 0; timeLeft = DURATION; spawnTimer = 0.2;
    scoreEl.textContent = "0";
    timeEl.textContent = DURATION;
    timeEl.classList.remove("low");
    startScreen.classList.add("hidden");
    endScreen.classList.add("hidden");
    playing = true;
  }

  function endGame() {
    playing = false;
    var isNew = score > best;
    if (isNew) {
      best = score;
      try { localStorage.setItem("ssc_best", String(best)); } catch (e) {}
    }
    finalEl.textContent = score;
    bestEl.textContent = isNew ? "ハイスコア更新！" : "ハイスコア: " + best;
    endScreen.classList.remove("hidden");
    document.getElementById("retryBtn").focus();
  }

  document.getElementById("startBtn").addEventListener("click", startGame);
  document.getElementById("retryBtn").addEventListener("click", startGame);

  last = performance.now();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
